name: Run protoMOMxx unit tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Install MPI
        run: sudo apt update && sudo apt install build-essential libopenmpi-dev openmpi-bin

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and run tests
        run: ./build_and_run.sh --tests --fresh

      - name: Run the multi-rank tests on 2 MPI ranks
        run: ctest --test-dir ./build -L mpi --output-on-failure

      # The configuration turbo-stack's Stage 1 uses: only mom_kernels and
      # mom_bridge, no solo driver. Reuses the AMReX build_and_run.sh installed.
      - name: Build only the MOM kernel and bridge targets
        run: |
          cmake -S . -B ./build-kernels-only \
                -DPROTOMOM_KERNELS_ONLY=ON \
                -DCMAKE_PREFIX_PATH="${PWD}/dependencies/amrex/install"
          cmake --build ./build-kernels-only -j 2
